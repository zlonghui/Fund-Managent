};

window._deleteCategory = function(id) {
  var catName = CategoryService.getCategoryName(id);
  var funds = FundService.getAllFunds();
  var usedFunds = funds.filter(function(f) { return f.category === id; });

  if (usedFunds.length > 0) {
    showToast('该分类下有' + usedFunds.length + '只基金，请先移动或删除');
    return;
  }

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal" style="max-width:360px"><h2>删除分类</h2>' +
    '<p style="margin-bottom:16px;color:#666">确定要删除分类「' + catName + '」吗？</p>' +
    '<div class="form-actions"><button class="btn btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">取消</button>' +
    '<button class="btn btn-danger" id="confirmDelCatBtn">删除</button></div></div>';
  document.body.appendChild(overlay);

  document.getElementById('confirmDelCatBtn').addEventListener('click', function() {
    var result = CategoryService.deleteCategory(id);
    overlay.remove();
    if (!result.success) { showToast(result.error); return; }
    showToast('分类已删除');
    render();
  });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
};

// ============================================================
// Section U: Settings Actions
// ============================================================

window._saveRatios = function() {
  var categories = CategoryService.getCategories();
  var ratios = {};
  for (var i = 0; i < categories.length; i++) {
    var el = document.getElementById('ratio_' + categories[i].id);
    ratios[categories[i].id] = parseFloat(el ? el.value : 0) || 0;
  }
  var errEl = document.getElementById('ratioError');
  if (errEl) errEl.textContent = '';
  var result = RatioService.setTargetRatios(ratios);
  if (!result.success) { if (errEl) errEl.textContent = result.error; return; }
  showToast('目标比例已保存');
  render();
};

window._refreshAll = function() {
  var btn = document.getElementById('refreshAllBtn');
  if (btn) { btn.disabled = true; btn.textContent = '刷新中...'; }
  var funds = FundService.getAllFunds();
  if (funds.length === 0) {
    showToast('暂无基金可刷新');
    if (btn) { btn.disabled = false; btn.textContent = '一键刷新所有净值'; }
    return;
  }
  FundAPI.refreshAllNetValues(funds).then(function(results) {
    var successCount = results.filter(function(r) { return r.success; }).length;
    var failCount = results.filter(function(r) { return !r.success; }).length;
    var resultEl = document.getElementById('refreshResult');
    if (resultEl) {
      var cls = failCount === 0 ? 'success' : 'partial';
      resultEl.innerHTML = '<div class="refresh-result ' + cls + '">刷新完成：成功 ' + successCount + ' 只' + (failCount > 0 ? '，失败 ' + failCount + ' 只' : '') + '</div>';
    }
    if (btn) { btn.disabled = false; btn.textContent = '一键刷新所有净值'; }
    showToast('刷新完成: ' + successCount + '成功, ' + failCount + '失败');
  });
};

window._refreshFundPrice = function(fundId) {
  var fund = FundService.getFund(fundId);
  if (!fund) return;
  showToast('正在获取最新净值...');
  FundAPI.fetchFundInfo(fund.code).then(function(info) {
    if (!info) { showToast('获取净值失败'); return; }
    var oldPrice = fund.currentPrice;
    var newPrice = info.netValue;
    if (oldPrice !== newPrice) {
      RecordService.addPriceChangeRecord(fundId, oldPrice, newPrice);
      FundService.updateFund(fundId, { currentPrice: newPrice });
      showToast('净值已更新: ' + oldPrice.toFixed(4) + ' → ' + newPrice.toFixed(4));
    } else {
      showToast('净值未变化');
    }
    render();
  });
};

window._exportData = function() {
  var json = StorageService.exportAll();
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'fund_manager_backup_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
};

window._importData = function(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var json = e.target.result;
    var data;
    try { data = JSON.parse(json); } catch (err) { showToast('文件格式不正确，无法解析 JSON'); return; }
    var validation = StorageService.validateImportData(data);
    if (!validation.valid) { showToast('文件格式错误: ' + validation.errors.join('; ')); return; }
    showImportModeModal(json);
  };
  reader.readAsText(file);
  event.target.value = '';
};

function showImportModeModal(json) {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal" style="max-width:360px"><h2>导入模式</h2>' +
    '<p style="margin-bottom:16px;color:#666">请选择导入方式：</p>' +
    '<div class="form-actions" style="flex-direction:column;gap:8px">' +
    '<button class="btn btn-primary btn-block" id="importOverwrite">覆盖现有数据</button>' +
    '<button class="btn btn-secondary btn-block" id="importMerge">合并数据（保留现有）</button>' +
    '<button class="btn btn-secondary btn-block" onclick="this.closest(\'.modal-overlay\').remove()">取消</button></div></div>';
  document.body.appendChild(overlay);
  document.getElementById('importOverwrite').addEventListener('click', function() {
    var result = StorageService.importAll(json, 'overwrite');
    overlay.remove();
    if (result.success) { showToast('数据已覆盖导入'); render(); }
    else showToast('导入失败: ' + result.error);
  });
  document.getElementById('importMerge').addEventListener('click', function() {
    var result = StorageService.importAll(json, 'merge');
    overlay.remove();
    if (result.success) { showToast('数据已合并导入'); render(); }
    else showToast('导入失败: ' + result.error);
  });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

window._resetData = function() {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal" style="max-width:360px"><h2>⚠️ 重置数据</h2>' +
    '<p style="margin-bottom:16px;color:#666">确定要重置所有数据吗？<br><span class="text-muted">所有基金、涨跌记录、加减仓记录和目标比例都将被清除，此操作不可撤销。</span></p>' +
    '<div class="form-actions"><button class="btn btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">取消</button>' +
    '<button class="btn btn-danger" id="confirmResetBtn">确认重置</button></div></div>';
  document.body.appendChild(overlay);
  document.getElementById('confirmResetBtn').addEventListener('click', function() {
    StorageService.reset();
    overlay.remove();
    showToast('数据已重置');
    navigate('dashboard');
  });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
};

// ============================================================
// Section V: Initialize
// ============================================================

render();
</script>
</body>
</html>
